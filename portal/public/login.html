<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · ZKAAVS</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><a class="brand" href="https://zkaavs.app">ZKAAVS</a><span class="tag">Panel privado</span></header>
  <main class="shell compact">
    <p class="eyebrow">Equipo educativo</p>
    <h1>Acceso al panel</h1>
    <p class="lead">Inicia sesión para gestionar invitaciones de Canva Educación.</p>
    <form class="card" method="post" action="/login">
      <label for="password">Contraseña del panel</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
