<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · Canva Pro</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/"><span>Canva Pro</span></a>
    <span class="header-note">Acceso al panel</span>
  </header>
  <main class="login-layout">
    <section class="card login-card" aria-labelledby="form-title">
      <h1 id="form-title">Iniciar sesión</h1>
      <p class="card-subtitle">Usa el correo y la contraseña de tu cuenta.</p>
      <form class="login-form" method="post" action="/login">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="text" inputmode="email" autocomplete="username" maxlength="254" placeholder="correo@ejemplo.com" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-feedback" class="error" role="alert">__LOGIN_ERROR__</p>
        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
